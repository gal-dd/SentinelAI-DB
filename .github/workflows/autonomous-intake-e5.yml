name: Autonomous intake E5 screening

on:
  pull_request:
    branches: [poc/defense-focused-v2]
    paths:
      - drafts/autonomous-intake-v1/batch-0006-candidates.jsonl
      - config/scenarios.json
      - .github/workflows/autonomous-intake-e5.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e5-screen:
    name: E5 semantic screening (not publication)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install local semantic engine (no model API)
        run: python -m pip install -r requirements-semantic.txt
      - name: Download pinned open E5 ONNX assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .poc-local/e5
          base="https://huggingface.co/Xenova/multilingual-e5-small/resolve/761b726dd34fb83930e26aab4e9ac3899aa1fa78"
          curl -fL --retry 3 --retry-delay 2 "$base/tokenizer.json" -o .poc-local/e5/tokenizer.json
          curl -fL --retry 3 --retry-delay 2 "$base/onnx/model_int8.onnx" -o .poc-local/e5/model_int8.onnx
          echo "0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39  .poc-local/e5/tokenizer.json" | sha256sum -c -
          echo "4d24e2bc01a447951524466ef533e52944bf48509e6552810bcee1a2711cb02c  .poc-local/e5/model_int8.onnx" | sha256sum -c -
      - name: Run signed production preflight and E5 preparation
        run: |
          python -B -m sentinel_dataset verify
          python -B -m sentinel_dataset prepare \
            drafts/autonomous-intake-v1/batch-0006-candidates.jsonl \
            --model-dir .poc-local/e5 \
            --packet .poc-local/packet.json
      - name: Summarize high-risk semantic candidates
        run: |
          python - <<'PY'
          import json
          with open(".poc-local/packet.json", encoding="utf-8") as stream:
              packet = json.load(stream)
          print("E5 model:", packet["semantic"]["model"])
          print("Compared entries:", packet["semantic"]["indexed_records"])
          print("Candidate count:", packet["semantic"]["scanned_records"])
          print("All similarity alerts:", len(packet["alerts"]))
          print("High-risk review alerts:", len(packet["review_alerts"]))
          print("Text-only sample for blind review:", len(packet["texts"]))
          print("Domain sample:", len(packet["domain_texts"]))
          for hit in sorted(packet["review_alerts"], key=lambda x: x["score"], reverse=True)[:20]:
              print("HIGH_RISK", json.dumps(
                  {"id": hit["id"], "method": hit["method"], "score": hit["score"],
                   "different_labels": hit["different_labels"]}, ensure_ascii=False))
          print("E5 screening complete; this does NOT approve a checkpoint.")
          PY
      - name: Compare candidate embeddings against all 6,100 production records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sentinel_dataset import checkpoints as cp
          from sentinel_dataset.core import read_jsonl, fingerprint
          from sentinel_dataset.semantic import semantic_scan

          state, signed = cp.load_progress()
          imported = cp.load_external_imports(state)
          if len(signed) != 2500 or len(imported) != 3600:
              raise ValueError(f"Unexpected production baseline: signed={len(signed)}, imported={len(imported)}")
          external_rows = [
              {"text": item["אובייקט"], "label": item["סיווג"],
               "pair_id": None, "source_group_id": f"external-{item['ID']}"}
              for item in imported
          ]
          candidates = read_jsonl(Path("drafts/autonomous-intake-v1/batch-0006-candidates.jsonl"))
          reference = [*signed, *external_rows]
          alerts, metrics = semantic_scan(reference, candidates,
              Path(".poc-local/e5"), Path(".poc-local/embeddings"))
          important = [a for a in alerts if a["intentional_pair"] or a["score"] >= 0.97
                       or (a["different_labels"] and a["score"] >= 0.94)]
          reference_fingerprints = {fingerprint(r) for r in reference}
          candidates_fingerprints = {fingerprint(r) for r in candidates}
          text_lookup = {fingerprint(r): r["text"] for r in [*reference, *candidates]}
          def represent(a):
              return {
                  **a,
                  "texts": [text_lookup[k] for k in a["records"]],
                  "matched_external_or_signed": any(k in reference_fingerprints for k in a["records"]),
                  "candidate_in_pair": any(k in candidates_fingerprints for k in a["records"])
              }
          top = sorted(alerts, key=lambda a: a["score"], reverse=True)[:80]
          report = {
              "baseline": {"signed": len(signed), "external": len(imported),
                           "candidate": len(candidates)},
              "semantic": metrics,
              "all_alerts": len(alerts),
              "high_risk": len(important),
              "high_risk_pairs": [represent(a) for a in important],
              "top_80_pairs": [represent(a) for a in top],
              "status": "semantic_screen_only_not_publication_approval"
          }
          path = Path(".poc-local/full-baseline-e5-report.json")
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("FULL_BASELINE", json.dumps({"records": 6100,
              "candidates": len(candidates), "alerts": len(alerts),
              "high_risk": len(important), "highest_score":
              max((a["score"] for a in alerts), default=0)}, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: autonomous-intake-e5-review-packet
          path: |
            .poc-local/packet.json
            .poc-local/full-baseline-e5-report.json
          retention-days: 7
