name: Batch 0010 read-only quality screening
on:
  push:
    branches: [producer/chat-batch-0010-v1]
    paths:
      - drafts/chat/batch-0010/batch-0010-candidates.jsonl
      - scripts/validate_batch_0010.py
      - scripts/batch_0010_e5_audit.py
      - .github/workflows/batch-0010-e5.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: batch-0010-qa
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Validate exact structure and quotas
        run: python -B scripts/validate_batch_0010.py --candidates drafts/chat/batch-0010/batch-0010-candidates.jsonl --report .poc-local/structural-qa.json
      - name: Install semantic dependencies
        run: python -m pip install -r requirements-semantic.txt
      - name: Download verified model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .poc-local/e5
          base="https://huggingface.co/Xenova/multilingual-e5-small/resolve/761b726dd34fb83930e26aab4e9ac3899aa1fa78"
          curl -fL --retry 3 "$base/tokenizer.json" -o .poc-local/e5/tokenizer.json
          curl -fL --retry 3 "$base/onnx/model_int8.onnx" -o .poc-local/e5/model_int8.onnx
          echo "0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39  .poc-local/e5/tokenizer.json" | sha256sum -c -
          echo "4d24e2bc01a447951524466ef533e52944bf48509e6552810bcee1a2711cb02c  .poc-local/e5/model_int8.onnx" | sha256sum -c -
      - name: Fetch and verify live production
        run: |
          git fetch origin poc/defense-focused-v2
          git worktree add --detach .poc-local/production origin/poc/defense-focused-v2
          cd .poc-local/production
          python -B -m sentinel_dataset verify
      - name: Screen all candidate records against complete live production
        run: |
          python -B scripts/batch_0010_e5_audit.py --production .poc-local/production --candidates drafts/chat/batch-0010/batch-0010-candidates.jsonl --model-dir .poc-local/e5 --cache-dir .poc-local/embeddings --output .poc-local/batch-0010-e5.json
      - name: Prepare official review only after checkpoint 0009
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path(".poc-local/production")
          state=json.loads((root/"progress.json").read_text(encoding="utf-8"))
          if (state["production_records"],state["last_checkpoint"],state["next_id"])!=(8100,9,8101):
              print("PRELIMINARY_ONLY: batch 0009 not yet published")
              raise SystemExit(0)
          live=json.loads((root/"config/scenarios.json").read_text(encoding="utf-8"))
          source=json.loads(pathlib.Path("config/scenarios.json").read_text(encoding="utf-8"))
          rows=[json.loads(line) for line in pathlib.Path("drafts/chat/batch-0010/batch-0010-candidates.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          for row in rows:
              key=row["scenario_id"]
              if key in live and live[key]!=source[key]:
                  raise SystemExit("Scenario collision "+key)
              live[key]=source[key]
          (root/"config/scenarios.json").write_text(json.dumps(live,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          (root/".poc-local").mkdir(exist_ok=True)
          (root/".poc-local/ready-0010").touch()
          PY
          if [ -f .poc-local/production/.poc-local/ready-0010 ]; then
            cd .poc-local/production
            python -B -m sentinel_dataset prepare "$GITHUB_WORKSPACE/drafts/chat/batch-0010/batch-0010-candidates.jsonl" --model-dir "$GITHUB_WORKSPACE/.poc-local/e5" --packet "$GITHUB_WORKSPACE/.poc-local/batch-0010-official-packet.json"
          fi
      - name: Retain screening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-0010-quality-evidence
          path: |
            .poc-local/structural-qa.json
            .poc-local/batch-0010-e5.json
            .poc-local/batch-0010-official-packet.json
          if-no-files-found: ignore
          retention-days: 7
