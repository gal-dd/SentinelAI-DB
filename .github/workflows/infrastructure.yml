name: Infrastructure

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

on:
  push:
    branches: [poc/defense-focused-v2]
  pull_request:
    branches: [poc/defense-focused-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Check syntax, configuration JSON and local documentation links
        run: python -B scripts/check_infrastructure.py
      - name: Test infrastructure checker
        run: python -B -m unittest discover -s tests -p test_infrastructure.py -v
      - name: Test isolated civilian system I/O
        run: python -B -m unittest discover -s tests -p test_system_io.py -v

      - name: Test classification and domain compatibility
        run: python -B -m unittest discover -s tests -p test_defense_v2.py -v
      - name: Verify signed production checkpoints with canonical labels
        run: python -B -m sentinel_dataset verify
