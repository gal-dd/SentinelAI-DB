name: Batch 0008 independent baseline E5 QA

on:
  pull_request:
    branches: [poc/defense-focused-v2]
    paths:
      - drafts/chat/batch-0008/batch-0008-candidates.jsonl
      - scripts/batch_0008_e5_audit.py
      - scripts/validate_batch_0008.py
      - config/scenarios.json
      - .github/workflows/batch-0008-e5.yml
  workflow_dispatch:

concurrency:
  group: batch-0008-e5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e5:
    name: E5 against current production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Validate exact schema, domain and label quotas
        run: python -B scripts/validate_batch_0008.py --candidates drafts/chat/batch-0008/batch-0008-candidates.jsonl --report .poc-local/structural-qa.json
      - name: Install open semantic model dependencies
        run: python -m pip install -r requirements-semantic.txt
      - name: Download verified pinned ONNX model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .poc-local/e5
          base="https://huggingface.co/Xenova/multilingual-e5-small/resolve/761b726dd34fb83930e26aab4e9ac3899aa1fa78"
          curl -fL --retry 3 --retry-delay 2 "$base/tokenizer.json" -o .poc-local/e5/tokenizer.json
          curl -fL --retry 3 --retry-delay 2 "$base/onnx/model_int8.onnx" -o .poc-local/e5/model_int8.onnx
          echo "0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39  .poc-local/e5/tokenizer.json" | sha256sum -c -
          echo "4d24e2bc01a447951524466ef533e52944bf48509e6552810bcee1a2711cb02c  .poc-local/e5/model_int8.onnx" | sha256sum -c -
      - name: Fetch latest production snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin poc/defense-focused-v2
          git worktree add --detach .poc-local/production origin/poc/defense-focused-v2
      - name: Verify current production signatures
        run: |
          cd .poc-local/production
          python -B -m sentinel_dataset verify > ../production-verify.log
          python - <<'PY'
          import json
          p=json.load(open("progress.json",encoding="utf-8"))
          actual=(p["production_records"],p["last_checkpoint"],p["next_id"])
          if actual!=(7100,7,7101):
              raise SystemExit(f"Unexpected live production baseline: {actual}")
          print("LIVE_BASELINE_0008",actual)
          PY
      - name: Run E5 similarity including all signed and external records
        run: |
          python -B scripts/batch_0008_e5_audit.py \
            --production .poc-local/production \
            --candidates drafts/chat/batch-0008/batch-0008-candidates.jsonl \
            --model-dir .poc-local/e5 \
            --cache-dir .poc-local/embeddings \
            --output .poc-local/batch-0008-e5.json
      - name: Run official production prepare and print blind sample keys
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path(".poc-local/production")
          dest=root/"config/scenarios.json"
          live=json.loads(dest.read_text(encoding="utf-8"))
          source=json.loads(pathlib.Path("config/scenarios.json").read_text(encoding="utf-8"))
          rows=[json.loads(line) for line in pathlib.Path("drafts/chat/batch-0008/batch-0008-candidates.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          for row in rows:
              key=row["scenario_id"]
              info=source.get(key)
              if not info or not info.get("domain"):
                  raise SystemExit(f"Missing scenario {key}")
              if key in live and live[key]!=info:
                  raise SystemExit(f"Live scenario conflict: {key}")
              live[key]=info
          dest.write_text(json.dumps(live,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          (
            cd .poc-local/production
            python -B -m sentinel_dataset prepare \
              "$GITHUB_WORKSPACE/drafts/chat/batch-0008/batch-0008-candidates.jsonl" \
              --model-dir "$GITHUB_WORKSPACE/.poc-local/e5" \
              --packet "$GITHUB_WORKSPACE/.poc-local/batch-0008-official-packet.json"
          )
          python - <<'PY'
          import json
          p=json.load(open(".poc-local/batch-0008-official-packet.json", encoding="utf-8"))
          print("PREPARE_SUMMARY", json.dumps(
              {"labels":len(p["texts"]), "domains":len(p["domain_texts"]),
               "high_risk":len(p["review_alerts"]), "pair_count":len(p["counterfactual_pairs"])},
              ensure_ascii=False))
          for k,text in p["texts"].items():
              print("BLIND_LABEL", json.dumps({"fingerprint":k,"text":text}, ensure_ascii=False))
          for k,text in p["domain_texts"].items():
              print("BLIND_DOMAIN", json.dumps({"fingerprint":k,"text":text}, ensure_ascii=False))
          PY
      - name: Upload full E5 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-0008-e5-evidence
          path: |
            .poc-local/batch-0008-e5.json
            .poc-local/structural-qa.json
            .poc-local/batch-0008-official-packet.json
            .poc-local/production-verify.log
          if-no-files-found: ignore
          retention-days: 7
